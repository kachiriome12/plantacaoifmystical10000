name: Compilar Plantacao IF Mystical

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Criar configuração Gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.minecraftforge.net/' }
              }
          }

          rootProject.name = 'plantacaoifmystical10000'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'eclipse'
              id 'idea'
              id 'maven-publish'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }

          version = '1.0.0'
          group = 'com.plantacaoifmystical10000'

          base {
              archivesName = 'plantacaoifmystical10000'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: '1.20.1'
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
          }

          tasks.named('jar', Jar).configure {
              finalizedBy 'reobfJar'
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

      - name: Compilar mod
        run: |
          gradle build --no-daemon

      - name: Criar pasta de saída
        run: |
          mkdir -p out
          cp build/libs/*.jar out/

      - name: Enviar JAR
        uses: actions/upload-artifact@v4
        with:
          name: plantacaoifmystical10000-JAR
          path: out/*.jar
