name: Compilar Infinite Soil

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Preparar projeto
        run: |
          echo "Minecraft: 1.20.1"
          echo "Forge: 47.3.0"
          echo "Mod: Infinite Soil"

      - name: Compilar mod
        run: |
          gradle build --no-daemon

      - name: Criar pasta de saída
        run: |
          mkdir -p out
          cp build/libs/*.jar out/

      - name: Enviar JAR
        uses: actions/upload-artifact@v4
        with:
          name: Infinite-Soil-JAR
          path: out/*.jar
